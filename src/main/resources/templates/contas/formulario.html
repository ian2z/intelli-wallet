<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="max-w-xl">
        <a th:href="@{/contas}" class="text-sm font-medium text-teal-800 underline-offset-4 hover:underline">Voltar às contas</a>
        <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950">Criar conta</h1>
        <p class="mt-3 text-slate-700">Adicione uma conta corrente ou um cartão à sua lista.</p>

        <form th:action="@{/contas}" th:object="${formulario}" method="post" class="mt-8 space-y-5 rounded-xl bg-white p-6 shadow-sm sm:p-8" novalidate>
            <div>
                <label for="numero" class="block text-sm font-semibold text-slate-800">Número</label>
                <input id="numero" type="text" th:field="*{numero}" required maxlength="40" aria-describedby="numero-erro" th:attr="aria-invalid=${#fields.hasErrors('numero')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="numero-erro" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <div>
                <label for="descricao" class="block text-sm font-semibold text-slate-800">Descrição</label>
                <input id="descricao" type="text" th:field="*{descricao}" required maxlength="120" placeholder="Ex.: Minha conta principal" aria-describedby="descricao-erro" th:attr="aria-invalid=${#fields.hasErrors('descricao')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none placeholder:text-slate-500 focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="descricao-erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <div>
                <label for="tipo" class="block text-sm font-semibold text-slate-800">Tipo</label>
                <select id="tipo" th:field="*{tipo}" required aria-describedby="tipo-erro" th:attr="aria-invalid=${#fields.hasErrors('tipo')}" class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                    <option value="">Selecione o tipo</option>
                    <option value="CORRENTE">Conta corrente</option>
                    <option value="CARTAO">Cartão de crédito</option>
                </select>
                <p id="tipo-erro" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <div id="diaFechamentoGrupo" hidden>
                <label for="diaFechamento" class="block text-sm font-semibold text-slate-800">Dia do fechamento</label>
                <input id="diaFechamento" type="number" th:field="*{diaFechamento}" min="1" max="31" inputmode="numeric" aria-describedby="diaFechamento-ajuda diaFechamento-erro" th:attr="aria-invalid=${#fields.hasErrors('diaFechamento')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="diaFechamento-ajuda" class="mt-2 text-sm text-slate-600">Informe um dia entre 1 e 31.</p>
                <p id="diaFechamento-erro" th:if="${#fields.hasErrors('diaFechamento')}" th:errors="*{diaFechamento}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <button type="submit" class="w-full rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">Salvar conta</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<script defer th:src="@{/js/conta-form.js}"></script>
</body>
</html>
