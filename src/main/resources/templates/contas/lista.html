<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minhas contas')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<div th:replace="~{fragments/layout :: mensagem}"></div>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Minhas contas</h1>
            <p class="mt-2 text-slate-700" th:text="|Contas de ${correntista.nome}|">Contas do correntista</p>
        </div>
        <a th:if="${modoDev}" th:href="@{/dev/correntistas}" class="text-sm font-medium text-teal-800 underline-offset-4 hover:underline">Trocar correntista</a>
    </div>

    <div th:if="${#lists.isEmpty(contas)}" class="mt-8 rounded-xl bg-white p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-slate-950">Nenhuma conta cadastrada</h2>
        <p class="mt-2 text-slate-700">Quando você criar uma conta corrente ou cartão, ela aparecerá aqui.</p>
    </div>

    <div th:unless="${#lists.isEmpty(contas)}" class="mt-8 overflow-x-auto rounded-xl bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <caption class="sr-only">Contas correntes e cartões do correntista atual</caption>
            <thead class="border-b border-slate-200 bg-slate-100 text-slate-700">
                <tr>
                    <th scope="col" class="px-5 py-4 font-semibold">Conta</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Número</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Tipo</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Fechamento</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Ações</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="conta : ${contas}">
                    <td class="px-5 py-4 font-medium text-slate-950" th:text="${conta.descricao}">Descrição</td>
                    <td class="px-5 py-4 tabular-nums text-slate-700" th:text="${conta.numero}">0000-0</td>
                    <td class="px-5 py-4">
                        <span th:if="${conta.tipo.name() == 'CORRENTE'}" class="rounded-full bg-sky-100 px-3 py-1 text-xs font-semibold text-sky-900">Corrente</span>
                        <span th:if="${conta.tipo.name() == 'CARTAO'}" class="rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-900">Cartão</span>
                    </td>
                    <td class="px-5 py-4 text-slate-700" th:text="${conta.diaFechamento != null ? 'Dia ' + conta.diaFechamento : '—'}">—</td>
                    <td class="px-5 py-4"><a th:href="@{/contas/{id}/transacoes(id=${conta.id})}" class="font-semibold text-teal-800 underline-offset-4 hover:underline">Ver transações</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
