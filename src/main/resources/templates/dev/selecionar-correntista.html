<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Selecionar correntista')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<div th:replace="~{fragments/layout :: erro}"></div>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="max-w-xl">
        <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Escolher correntista</h1>
        <p class="mt-3 text-slate-700">Esta seleção está disponível apenas no ambiente de desenvolvimento enquanto o login não é integrado.</p>

        <form th:action="@{/dev/correntistas/selecionar}" method="post" class="mt-8 space-y-5 rounded-xl bg-white p-6 shadow-sm sm:p-8">
            <div>
                <label for="correntistaId" class="block text-sm font-semibold text-slate-800">Correntista</label>
                <select id="correntistaId" name="correntistaId" required class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                    <option value="">Selecione uma pessoa</option>
                    <option th:each="correntista : ${correntistas}" th:value="${correntista.id}" th:text="|${correntista.nome} (${correntista.login})|">Nome</option>
                </select>
            </div>
            <button type="submit" class="w-full rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">Ver contas</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
