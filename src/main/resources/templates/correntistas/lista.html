<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Correntistas')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<div th:replace="~{fragments/layout :: mensagem}"></div>
<div th:replace="~{fragments/layout :: erro}"></div>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Correntistas</h1>
            <p class="mt-2 text-slate-700">Listagem de correntistas cadastrados no IntelliWallet.</p>
        </div>
        <div>
            <a th:href="@{/correntistas/novo}" class="rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">Novo correntista</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(correntistas)}" class="mt-8 rounded-xl bg-white p-8 shadow-sm">
        <p class="text-slate-700">Nenhum correntista cadastrado no momento.</p>
    </div>

    <div th:unless="${#lists.isEmpty(correntistas)}" class="mt-8 overflow-x-auto rounded-xl bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <caption class="sr-only">Tabela de correntistas cadastrados</caption>
            <thead class="border-b border-slate-200 bg-slate-100 text-slate-700">
                <tr>
                    <th scope="col" class="px-5 py-4 font-semibold">Nome</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Login</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Status</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Ações</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="correntista : ${correntistas}">
                    <td class="px-5 py-4 font-medium text-slate-950" th:text="${correntista.nome}">Nome do correntista</td>
                    <td class="px-5 py-4 text-slate-700" th:text="${correntista.login}">login</td>
                    <td class="px-5 py-4">
                        <span th:if="${correntista.bloqueado}" class="rounded-lg bg-rose-50 px-3 py-2 font-semibold text-rose-700">Bloqueado</span>
                        <span th:unless="${correntista.bloqueado}" class="rounded-lg bg-teal-50 px-3 py-2 font-semibold text-teal-900">Ativo</span>
                    </td>
                    <td class="px-5 py-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <a th:href="@{/correntistas/{id}/editar(id=${correntista.id})}"
                               class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 hover:bg-slate-100">Editar</a>
                            <button type="button" disabled
                                    class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium text-slate-600"
                                    title="Funcionalidade em desenvolvimento"
                                    th:text="${correntista.bloqueado ? 'Desbloquear' : 'Bloquear'}">Bloquear</button>
                            <form th:action="@{/correntistas/{id}/excluir(id=${correntista.id})}" method="post"
                                  th:onsubmit="|return confirm('Deseja realmente excluir o correntista \'${correntista.nome}\'? Todas as suas contas e transações serão removidas em cascata.');|"
                                  class="inline">
                                <button type="submit"
                                        class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium text-rose-700 hover:bg-rose-50">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
