<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar cadastro')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="max-w-xl">
        <a th:href="@{/}" class="text-sm font-medium text-teal-800 underline-offset-4 hover:underline">Voltar ao início</a>
        <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950">Criar cadastro</h1>
        <p class="mt-3 text-slate-700">Preencha seus dados para começar a usar o IntelliWallet.</p>

        <form th:action="@{/cadastro}" th:object="${formulario}" method="post" class="mt-8 space-y-5 rounded-xl bg-white p-6 shadow-sm sm:p-8" novalidate>
            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-800">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" autocomplete="name" required maxlength="120" aria-describedby="nome-erro" th:attr="aria-invalid=${#fields.hasErrors('nome')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="nome-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <div>
                <label for="login" class="block text-sm font-semibold text-slate-800">Login</label>
                <input id="login" type="text" th:field="*{login}" autocomplete="username" required minlength="3" maxlength="60" aria-describedby="login-erro" th:attr="aria-invalid=${#fields.hasErrors('login')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="login-erro" th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-800">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="72" aria-describedby="senha-ajuda senha-erro" th:attr="aria-invalid=${#fields.hasErrors('senha')}" class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="senha-ajuda" class="mt-2 text-sm text-slate-600">Use pelo menos 8 caracteres.</p>
                <p id="senha-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="mt-2 text-sm text-rose-700"></p>
            </div>
            <button type="submit" class="w-full rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">Concluir cadastro</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
