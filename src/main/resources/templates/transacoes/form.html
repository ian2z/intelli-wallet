<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${transacaoId == null ? 'Nova transação' : 'Editar transação'})}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="max-w-xl">
        <a th:href="@{/contas/{id}(id=${conta.id})}" class="text-sm font-medium text-teal-800 underline-offset-4 hover:underline">Voltar para a conta</a>
        <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950"
            th:text="${transacaoId == null ? 'Nova transação' : 'Editar transação'}">Nova transação</h1>
        <p class="mt-3 text-slate-700" th:text="|Conta: ${conta.descricao} (${conta.numero})|">Conta selecionada</p>

        <form th:action="@{${transacaoId == null ? '/contas/' + conta.id + '/transacoes' : '/contas/' + conta.id + '/transacoes/' + transacaoId}}"
              th:object="${formulario}" method="post" class="mt-8 space-y-5 rounded-xl bg-white p-6 shadow-sm sm:p-8" novalidate>

            <div>
                <label for="data" class="block text-sm font-semibold text-slate-800">Data</label>
                <input id="data" type="date" th:field="*{data}" required
                       aria-describedby="data-erro" th:attr="aria-invalid=${#fields.hasErrors('data')}"
                       class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="data-erro" th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="descricao" class="block text-sm font-semibold text-slate-800">Descrição</label>
                <input id="descricao" type="text" th:field="*{descricao}" required maxlength="120" placeholder="Ex: Compras de supermercado"
                       aria-describedby="descricao-erro" th:attr="aria-invalid=${#fields.hasErrors('descricao')}"
                       class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="descricao-erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="valor" class="block text-sm font-semibold text-slate-800">Valor (R$)</label>
                <input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}" required placeholder="0.00"
                       aria-describedby="valor-erro" th:attr="aria-invalid=${#fields.hasErrors('valor')}"
                       class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="valor-erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="movimento" class="block text-sm font-semibold text-slate-800">Tipo de movimento</label>
                <select id="movimento" th:field="*{movimento}" required
                        aria-describedby="movimento-erro" th:attr="aria-invalid=${#fields.hasErrors('movimento')}"
                        class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                    <option value="">Selecione o movimento</option>
                    <option th:each="m : ${movimentos}" th:value="${m}"
                            th:text="${m.name() == 'CREDITO' ? 'Crédito (+)' : 'Débito (-)'}">Crédito</option>
                </select>
                <p id="movimento-erro" th:if="${#fields.hasErrors('movimento')}" th:errors="*{movimento}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="categoriaId" class="block text-sm font-semibold text-slate-800">Categoria</label>
                <select id="categoriaId" th:field="*{categoriaId}" required
                        aria-describedby="categoriaId-erro" th:attr="aria-invalid=${#fields.hasErrors('categoriaId')}"
                        class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                    <option value="">Selecione uma categoria</option>
                    <optgroup th:each="entry : ${categoriasPorNatureza}" th:label="${entry.key}">
                        <option th:each="cat : ${entry.value}" th:value="${cat.id}" th:text="${cat.nome}"
                                th:selected="${formulario.categoriaId == cat.id}">Categoria</option>
                    </optgroup>
                </select>
                <p id="categoriaId-erro" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div th:if="${transacaoId == null}">
                <label for="comentario" class="block text-sm font-semibold text-slate-800">Comentário (opcional)</label>
                <textarea id="comentario" th:field="*{comentario}" rows="3" maxlength="255" placeholder="Adicione uma observação sobre esta transação..."
                          aria-describedby="comentario-erro" th:attr="aria-invalid=${#fields.hasErrors('comentario')}"
                          class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200"></textarea>
                <p id="comentario-erro" th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div class="flex flex-wrap gap-3 pt-2">
                <button type="submit"
                        class="flex-1 rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
                        th:text="${transacaoId == null ? 'Salvar transação' : 'Atualizar transação'}">Salvar transação</button>
                <a th:href="@{/contas/{id}(id=${conta.id})}"
                   class="rounded-lg border border-slate-300 bg-white px-5 py-3 font-semibold text-slate-800 hover:bg-slate-100">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
