<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<div th:replace="~{fragments/layout :: mensagem}"></div>
<div th:replace="~{fragments/layout :: erro}"></div>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Categorias</h1>
            <p class="mt-2 text-slate-700">Gerencie as categorias usadas nas transações e no orçamento anual. Categorias são desativadas e nunca excluídas.</p>
        </div>
        <div>
            <a th:href="@{/categorias/nova}" class="rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">Nova categoria</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(categorias)}" class="mt-8 rounded-xl bg-white p-8 shadow-sm">
        <p class="text-slate-700">Nenhuma categoria cadastrada.</p>
    </div>

    <div th:unless="${#lists.isEmpty(categorias)}" class="mt-8 overflow-x-auto rounded-xl bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
            <caption class="sr-only">Tabela de categorias cadastradas</caption>
            <thead class="border-b border-slate-200 bg-slate-100 text-slate-700">
                <tr>
                    <th scope="col" class="px-5 py-4 font-semibold">Nome</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Natureza</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Ordem</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Status</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Ações</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="categoria : ${categorias}">
                    <td class="px-5 py-4 font-medium text-slate-950" th:text="${categoria.nome}">Salário</td>
                    <td class="px-5 py-4">
                        <span th:if="${categoria.natureza.name() == 'ENTRADA'}" class="rounded-lg bg-teal-50 px-3 py-2 font-semibold text-teal-900">Entrada</span>
                        <span th:if="${categoria.natureza.name() == 'SAIDA'}" class="rounded-lg bg-rose-50 px-3 py-2 font-semibold text-rose-700">Saída</span>
                        <span th:if="${categoria.natureza.name() == 'INVESTIMENTO'}" class="rounded-lg bg-slate-100 px-3 py-2 font-semibold text-slate-800">Investimento</span>
                    </td>
                    <td class="px-5 py-4 tabular-nums text-slate-700" th:text="${categoria.ordem}">1</td>
                    <td class="px-5 py-4">
                        <span th:if="${categoria.ativo}" class="rounded-lg bg-teal-50 px-3 py-2 font-semibold text-teal-900">Ativa</span>
                        <span th:unless="${categoria.ativo}" class="rounded-lg bg-slate-100 px-3 py-2 font-semibold text-slate-600">Inativa</span>
                    </td>
                    <td class="px-5 py-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <a th:href="@{/categorias/{id}/editar(id=${categoria.id})}"
                               class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 hover:bg-slate-100">Editar</a>
                            <form th:action="@{/categorias/{id}/alternar-status(id=${categoria.id}, pagina=${pagina.number})}" method="post"
                                  th:data-nome="${categoria.nome}"
                                  th:data-acao="${categoria.ativo ? 'desativar' : 'reativar'}"
                                  onsubmit="return confirm('Deseja ' + this.getAttribute('data-acao') + ' a categoria ' + this.getAttribute('data-nome') + '?');">
                                <button type="submit"
                                        class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium hover:bg-slate-100"
                                        th:classappend="${categoria.ativo} ? 'text-rose-700' : 'text-teal-800'"
                                        th:text="${categoria.ativo ? 'Desativar' : 'Reativar'}">Desativar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/paginacao :: controles(${pagina}, '/categorias')}"></div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
