<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formulario.id == null ? 'Nova categoria' : 'Editar categoria'})}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<div th:replace="~{fragments/layout :: mensagem}"></div>
<div th:replace="~{fragments/layout :: erro}"></div>

<main class="mx-auto max-w-6xl px-5 py-12 sm:py-16">
    <div class="max-w-xl">
        <a th:href="@{/categorias}" class="text-sm font-medium text-teal-800 underline-offset-4 hover:underline">Voltar às categorias</a>
        <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950"
            th:text="${formulario.id == null ? 'Nova categoria' : 'Editar categoria'}">Nova categoria</h1>
        <p class="mt-2 text-slate-700">Defina o nome, a natureza financeira e a ordem de exibição no orçamento anual.</p>

        <form th:action="${formulario.id == null} ? @{/categorias} : @{/categorias/{id}/editar(id=${formulario.id})}"
              th:object="${formulario}" method="post"
              class="mt-8 space-y-5 rounded-xl bg-white p-6 shadow-sm sm:p-8" novalidate>

            <div>
                <label for="nome" class="block text-sm font-semibold text-slate-800">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" required maxlength="80" placeholder="Ex: Alimentação fora"
                       aria-describedby="nome-erro" th:attr="aria-invalid=${#fields.hasErrors('nome')}"
                       class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="nome-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="natureza" class="block text-sm font-semibold text-slate-800">Natureza</label>
                <select id="natureza" th:field="*{natureza}" required
                        aria-describedby="natureza-erro" th:attr="aria-invalid=${#fields.hasErrors('natureza')}"
                        class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                    <option value="">Selecione a natureza</option>
                    <option th:each="nat : ${naturezas}" th:value="${nat}" th:text="${nat.descricao}">Entradas</option>
                </select>
                <p id="natureza-erro" th:if="${#fields.hasErrors('natureza')}" th:errors="*{natureza}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div>
                <label for="ordem" class="block text-sm font-semibold text-slate-800">Ordem dentro da natureza</label>
                <input id="ordem" type="number" min="1" th:field="*{ordem}" required
                       aria-describedby="ordem-erro" th:attr="aria-invalid=${#fields.hasErrors('ordem')}"
                       class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-3 text-slate-950 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-200">
                <p id="ordem-erro" th:if="${#fields.hasErrors('ordem')}" th:errors="*{ordem}" class="mt-2 text-sm text-rose-700"></p>
            </div>

            <div class="flex items-center gap-3">
                <input id="ativo" type="checkbox" th:field="*{ativo}" class="rounded border border-slate-300">
                <label for="ativo" class="text-sm font-medium text-slate-800">Categoria ativa (disponível para novas transações)</label>
            </div>

            <div class="flex flex-wrap gap-3 pt-2">
                <button type="submit"
                        class="flex-1 rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
                        th:text="${formulario.id == null ? 'Salvar categoria' : 'Atualizar categoria'}">Salvar categoria</button>
                <a th:href="@{/categorias}"
                   class="rounded-lg border border-slate-300 bg-white px-5 py-3 font-semibold text-slate-800 hover:bg-slate-100">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
