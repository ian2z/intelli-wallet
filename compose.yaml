services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${INTELLI_DB_NAME:-intelliwallet}
      POSTGRES_USER: ${INTELLI_DB_USER:-intelliwallet}
      POSTGRES_PASSWORD: ${INTELLI_DB_PASSWORD:-intelliwallet_dev}
    ports:
      - "${INTELLI_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
